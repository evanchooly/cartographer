name: Build Project

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Set up Maven via sdkman
        uses: sdkman/sdkman-action@main
        with:
          candidate: maven
          version: 4.0.0-rc-5

      - name: Build
        run: mvn -e -U install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build IntelliJ Plugin
        working-directory: cartographer-intellij-plugin
        run: ./gradlew buildPlugin

      - name: Upload IntelliJ Plugin
        uses: actions/upload-artifact@v4
        with:
          name: cartographer-intellij-plugin
          path: cartographer-intellij-plugin/build/distributions/*.zip

  Matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Is releasable branch
        id: releasable
        run: |
          if [ "${{ github.event.ref }}" == 'refs/heads/master' ] \
            || [ "${{ github.event.ref }}" == 'refs/heads/main' ] \
            || [[ "${{ github.event.ref }}" =~ ^refs/heads/[0-9]+\.[0-9]+\.x$ ]] \
            || [[ "${{ github.event.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+.[0-9]+$ ]]
          then
            echo "releasable=true" >> $GITHUB_OUTPUT
          else
            echo "releasable=false" >> $GITHUB_OUTPUT
          fi

    outputs:
      releasable: ${{ steps.releasable.outputs.releasable }}

  Release:
    needs:
      - Matrix
      - Build
    if: needs.Matrix.outputs.releasable == 'true'
    uses: evanchooly/workflows/.github/workflows/jreleaser.yml@master
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    with:
      java: 17
    secrets:
      GH_PUSH_TOKEN       : ${{ secrets.GH_PUSH_TOKEN }}
      MAVEN_GPG_PASSPHRASE      : ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      GPG_PUBLIC_KEY      : ${{ secrets.GPG_PUBLIC_KEY }}
      GPG_PRIVATE_KEY     : ${{ secrets.GPG_PRIVATE_KEY }}
      SONATYPE_USERNAME   : ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_TOKEN   : ${{ secrets.SONATYPE_TOKEN }}
