name: Build Project

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Set up Maven via sdkman
        uses: sdkman/sdkman-action@main
        with:
          candidate: maven
          version: 4.0.0-rc-5

      - name: Build
        run: mvn -e -U install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build IntelliJ Plugin
        working-directory: cartographer-intellij-plugin
        run: ./gradlew buildPlugin

      - name: Upload IntelliJ Plugin
        uses: actions/upload-artifact@v7
        with:
          name: cartographer-intellij-plugin
          path: cartographer-intellij-plugin/build/distributions/*.zip
